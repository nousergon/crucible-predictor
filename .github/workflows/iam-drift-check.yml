name: IAM Drift Check

# Catches drift between the codified inline policy under
# infrastructure/iam/<role>.json and the live AWS role state — the SOTA pattern
# from crucible-executor extended to the predictor role (alpha-engine-config#2340).
#
# Triggers:
#   - Every PR that touches infrastructure/iam/** — in --pr-diff-aware mode:
#     drift on roles the PR itself is changing is EXPECTED (the codified JSON
#     deliberately differs from live AWS until apply.sh runs post-merge;
#     alpha-engine-config#3492); drift on roles the PR does NOT touch is a hard
#     failure (out-of-band live edit).
#   - Daily at 09:35 UTC (catches out-of-band manual IAM edits; offset from the
#     executor repo's 09:30 run to avoid a concurrent OIDC assume pile-up) —
#     full hard-fail mode.
#   - Manual via workflow_dispatch — full hard-fail mode.
#
# AWS auth: OIDC -> github-actions-iam-drift-check role (read-only:
# iam:ListRolePolicies + iam:GetRolePolicy, scoped to the codified roles only;
# the role's iam-readonly.json already grants read on alpha-engine-predictor-role).

on:
  pull_request:
    paths:
      - 'infrastructure/iam/**'
      - '.github/workflows/iam-drift-check.yml'
  schedule:
    - cron: '35 9 * * *'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  drift-check:
    # Skip on PR events — the circularity fix from config#3495.
    # A PR that codifies new IAM is, by definition, ahead of live AWS
    # (apply.sh hasn't run yet), so comparing codified-vs-live as a PR
    # check is structurally guaranteed to show drift.  The post-merge
    # workflow (iam-drift-post-merge.yml) handles reconciliation on
    # merge; this scheduled+dispatch run catches out-of-band live edits.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # needed for git diff origin/main...HEAD in --pr-diff-aware mode

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::711398986525:role/github-actions-iam-drift-check
          aws-region: us-east-1

      - name: Run IAM drift check (codified vs live AWS)
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$IS_PR" = "true" ]; then
            python3 infrastructure/iam/check-drift.py --pr-diff-aware
          else
            python3 infrastructure/iam/check-drift.py
          fi
