# model/registry.py:522 (pre-edit line) and inference/stages/load_model.py:209
# (pre-edit line) are deliberately NOT listed here: both were RECORDED LOUD
# (logger.warning/log.warning with a named failure mode and recording
# surface) rather than carved out, per alpha-engine-config-I10226's triage --
# see the inline (a)/(c) comments at each site. Raising was judged
# architecturally unsafe at both (registry.py's restamp sits inside an
# already-successful promotion whose demote/promote calls must not abort;
# load_model.py's calibrator load has no safe outer handler to bubble to
