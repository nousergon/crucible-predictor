      expected-absence-with-fallback, same class as crucible-executor's
      optimizer_shadow.py carve-out; nothing downstream reads the meta.json
      unconditionally.
    expires: "2027-03-08"
    tracking: alpha-engine-config-I10226

  # ── Best-effort secondary local-cache write (write_output.py) ────────────
  - path: inference/stages/write_output.py
